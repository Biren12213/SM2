name: Build BiReN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "Gradle files:"
          find . -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build BiReN
        run: gradle clean assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload BiReN APK
        uses: actions/upload-artifact@v4
        with:
          name: BiReN-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
